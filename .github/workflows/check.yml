name: Check

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the versions must match
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy and tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install Rust
        run: pacman -Syu --noconfirm --needed git rust
      - uses: actions/checkout@v7
      - name: Versions agree
        env:
          TAG: ${{ inputs.tag }}
        run: packaging/version.sh ${TAG:+"$TAG"}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
