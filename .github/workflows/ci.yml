name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'research/**']
  pull_request:
    paths-ignore: ['**.md', 'research/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
  package:
    uses: ./.github/workflows/package.yml
