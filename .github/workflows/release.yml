name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      tag: ${{ github.ref_name }}
  package:
    uses: ./.github/workflows/package.yml
  publish:
    name: Publish
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GLIBC: ${{ needs.package.outputs.glibc }}
        run: packaging/publish.sh "$GITHUB_REF_NAME" dist
