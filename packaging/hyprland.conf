# OmaAsus bindings for Hyprland < 0.56 (classic syntax)
bind = SUPER, F12, exec, omaasus toggle
bind = SUPER SHIFT, F12, exec, omaasus window
bind = SUPER CTRL, G, exec, omaasus profile gaming
bind = SUPER CTRL, B, exec, omaasus profile balanced
exec-once = omaasus --overlay
layerrule = blur, omaasus-overlay
layerrule = ignorezero, omaasus-overlay
